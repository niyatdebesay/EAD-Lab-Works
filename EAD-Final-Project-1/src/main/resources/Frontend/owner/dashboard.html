<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Owner Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/owner-dashboard.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="#">Salon Owner Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="appointments.html">Appointments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="logout">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="welcome-section mb-4">
        <h1>Welcome, <span id="ownerName">Owner</span>!</h1>
        <p>Manage your salon and services</p>
    </div>

    <div class="row">
        <div class="col-md-12 mb-4">
            <div class="card salon-status-card">
                <div class="card-body">
                    <h5 class="card-title">Salon Status</h5>
                    <div id="salonStatus">
                        <!-- Salon status will be displayed here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="createSalonSection">
        <h2 class="section-title mb-4">Create Your Salon</h2>
        <div class="card">
            <div class="card-body">
                <form id="salonForm">
                    <div class="mb-3">
                        <label for="salonName" class="form-label">Salon Name</label>
                        <input type="text" class="form-control" id="salonName" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" required>
                    </div>
                    <div class="mb-3">
                        <label for="contact" class="form-label">Contact Number</label>
                        <input type="tel" class="form-control" id="contact" required>
                    </div>
                    <div class="mb-3">
                        <label for="openingHours" class="form-label">Opening Hours</label>
                        <input type="text" class="form-control" id="openingHours" placeholder="e.g., 9:00 AM - 7:00 PM" required>
                    </div>
                    <div class="mb-3">
                        <label for="imageUrl" class="form-label">Salon Image URL</label>
                        <input type="url" class="form-control" id="imageUrl">
                    </div>
                    <button type="submit" class="btn btn-primary">Create Salon</button>
                </form>
            </div>
        </div>
    </div>

    <div id="manageSalonSection" style="display: none;">
        <div class="row">
            <div class="col-md-12 mb-4">
                <h2 class="section-title">Manage Services</h2>
                <button class="btn btn-primary mb-3" onclick="openAddServiceModal()">Add New Service</button>
                <div class="card">
                    <div class="card-body">
                        <div id="servicesList">
                            <!-- Services will be listed here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Service Modal -->
<div class="modal fade" id="serviceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Service</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="serviceForm">
                    <div class="mb-3">
                        <label for="serviceName" class="form-label">Service Name</label>
                        <input type="text" class="form-control" id="serviceName" required>
                    </div>
                    <div class="mb-3">
                        <label for="serviceDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="serviceDescription" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="servicePrice" class="form-label">Price</label>
                        <input type="number" class="form-control" id="servicePrice" min="0" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="serviceDuration" class="form-label">Duration (minutes)</label>
                        <input type="number" class="form-control" id="serviceDuration" min="15" step="15" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Service</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JavaScript/owner/dashboard.js"></script>
</body>
</html>
