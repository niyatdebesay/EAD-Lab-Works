<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Salon - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/login.css">
</head>
<body>
<div class="container-fluid">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-4">
            <div class="login-card">
                <div class="card-body">
                    <h2 class="text-center mb-4">Welcome Back</h2>
                    <form id="login-form" autocomplete="on">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control form-control-lg" id="email" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" required minlength="8" autocomplete="current-password">
                        </div>
                        <div class="alert alert-danger d-none" id="error-message"></div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Login</button>
                        <p class="text-center mb-0">
                            Don't have an account? <a href="Signup.html">Sign up</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="JavaScript/login.js"></script>
</body>
</html>
