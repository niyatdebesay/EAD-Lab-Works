<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/salon.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Beauty Salon</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="appointments.html">My Appointments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="logout">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="salon-header mb-4">
        <div class="row">
            <div class="col-md-4">
                <img id="salonImage" src="../images/default-salon.jpg" alt="Salon" class="img-fluid salon-main-image">
            </div>
            <div class="col-md-8">
                <h1 id="salonName">Salon Name</h1>
                <p id="salonDescription" class="mb-3">Salon description will appear here...</p>
                <div class="salon-info">
                    <p><strong>Opening Hours:</strong> <span id="openingHours">9:00 AM - 7:00 PM</span></p>
                    <p><strong>Location:</strong> <span id="location">Address will appear here...</span></p>
                    <p><strong>Contact:</strong> <span id="contact">Contact details will appear here...</span></p>
                </div>
            </div>
        </div>
    </div>

    <h2 class="section-title mb-4">Our Services</h2>
    <div class="row" id="servicesList">
        <!-- Services will be dynamically added here -->
    </div>
</div>

<!-- Booking Modal -->
<div class="modal fade" id="bookingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Book Appointment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="bookingForm">
                    <div class="mb-3">
                        <label for="serviceName" class="form-label">Service</label>
                        <input type="text" class="form-control" id="serviceName" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="appointmentDate" class="form-label">Date</label>
                        <input type="date" class="form-control" id="appointmentDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="appointmentTime" class="form-label">Time</label>
                        <select class="form-control" id="appointmentTime" required>
                            <!-- Time slots will be dynamically added here -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="specialRequests" class="form-label">Special Requests (Optional)</label>
                        <textarea class="form-control" id="specialRequests" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-book">Book Appointment</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JavaScript/customer/salon.js"></script>
</body>
</html>
